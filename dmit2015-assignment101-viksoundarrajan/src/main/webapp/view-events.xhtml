<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui">
<f:view>
    <h:head>
        <title>View Campus Events</title>
    </h:head>
    <h:body>
        <h2>Campus Events</h2>
        <p>DMIT2015-1261 Assignment 1 by Vik Soundarrajan</p>

        <p:messages id="messages" showDetail="true" closable="true"/>

        <h:form id="viewEventsForm">
            <p:dataTable id="eventsTable" var="event" value="#{campusEventBean.eventList}">
                <p:column headerText="Event ID">
                    <h:outputText value="#{event.eventId}"/>
                </p:column>
                <p:column headerText="Event Name">
                    <h:outputText value="#{event.eventName}"/>
                </p:column>
                <p:column headerText="Organizer">
                    <h:outputText value="#{event.organizerName}"/>
                </p:column>
                <p:column headerText="Event Date">
                    <h:outputText value="#{event.eventDate}"/>
                </p:column>
                <p:column headerText="Capacity">
                    <h:outputText value="#{event.capacity}"/>
                </p:column>
                <p:column headerText="Summary">
                    <h:outputText value="#{event.eventSummary}"/>
                </p:column>
            </p:dataTable>
        </h:form>

        <h:link outcome="create-event" value="Create Another Event"/>

    </h:body>
</f:view>
</html>
